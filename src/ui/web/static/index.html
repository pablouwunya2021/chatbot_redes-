<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FarmaValle Chatbot</title>
<style>
  /* --- HCI notes ---------------------------------------------------------
     Palette: calm teal/green (trust, health, pharmacy). High-contrast text.
     Layout: single focal chat column + a secondary, dimmed "MCP activity"
     panel so the protocol is observable without competing with the chat.
     Feedback: tool calls appear as chips in real time; a typing dot shows
     the bot is working. Respects the OS light/dark preference. --------- */
  :root {
    --bg: #f4f7f6; --panel: #ffffff; --ink: #14302b; --muted: #5b6f6a;
    --brand: #0f8a76; --brand-ink: #ffffff; --user: #d7efe9; --bot: #ffffff;
    --border: #dfe7e4; --chip: #eef4f2; --accent: #0b6b5c; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1614; --panel: #14201d; --ink: #e6f0ed; --muted: #93a7a1;
      --brand: #13a892; --brand-ink: #04120f; --user: #123a33; --bot: #182824;
      --border: #22332e; --chip: #16241f; --accent: #3ad0b8; --err: #ff6b5e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--brand); color: var(--brand-ink); padding: 12px 18px;
           display: flex; align-items: center; gap: 10px; }
  header .logo { font-size: 22px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header .sub { font-size: 12px; opacity: .85; margin-left: auto; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 320px; gap: 0; overflow: hidden; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } #side { display: none; } }

  #chatcol { display: flex; flex-direction: column; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.45;
         white-space: pre-wrap; word-wrap: break-word; border: 1px solid var(--border); font-size: 14.5px; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.bot  { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.sys  { align-self: center; background: transparent; border: none; color: var(--muted); font-size: 12.5px; }
  .chips { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 6px; max-width: 80%; }
  .chip { font-size: 11.5px; background: var(--chip); border: 1px solid var(--border);
          color: var(--muted); padding: 3px 9px; border-radius: 999px; }
  .chip.err { color: var(--err); border-color: var(--err); }
  .chip b { color: var(--accent); font-weight: 600; }

  #composer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px;
              display: flex; gap: 8px; }
  #composer textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px;
              padding: 10px 12px; font: inherit; background: var(--bg); color: var(--ink); height: 44px; max-height: 140px; }
  #composer button { background: var(--brand); color: var(--brand-ink); border: none; border-radius: 10px;
              padding: 0 18px; font-weight: 600; cursor: pointer; }
  #composer button:disabled { opacity: .5; cursor: default; }

  #side { border-left: 1px solid var(--border); background: var(--panel); overflow-y: auto; padding: 14px; }
  #side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
             margin: 16px 0 8px; }
  #side h2:first-child { margin-top: 0; }
  .srv { font-size: 12.5px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px;
         margin-bottom: 6px; display: flex; justify-content: space-between; }
  .srv .dot { color: var(--brand); }
  #log { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
  #log .row { padding: 2px 0; border-bottom: 1px dashed var(--border); }
  #log .req { color: var(--accent); } #log .res { color: var(--brand); } #log .note { opacity:.7; }
  .dots span { animation: blink 1.2s infinite both; } .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  .suggest { display:flex; flex-wrap:wrap; gap:6px; padding: 0 20px 8px; }
  .suggest button { background: var(--chip); border:1px solid var(--border); color: var(--ink);
        border-radius: 999px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <span class="logo">💊</span>
  <h1>FarmaValle Chatbot</h1>
  <span class="sub" id="mode">connecting…</span>
</header>
<main>
  <section id="chatcol">
    <div id="messages"></div>
    <div class="suggest" id="suggest">
      <button>What can you help me with?</button>
      <button>I have a fever and a headache, what can I take?</button>
      <button>Is ibuprofen in stock at Zona 10?</button>
      <button>Who was Alan Turing?</button>
    </div>
    <form id="composer">
      <textarea id="input" placeholder="Type a message…  (Enter to send, Shift+Enter for newline)"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </section>
  <aside id="side">
    <h2>MCP Servers</h2>
    <div id="servers"></div>
    <h2>MCP Activity Log <button id="refreshlog" style="float:right;font-size:10px">refresh</button></h2>
    <div id="log"></div>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
const messages = $("#messages");

function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
  return d;
}
function addChips(events) {
  const wrap = document.createElement("div");
  wrap.className = "chips";
  for (const e of events) {
    if (e.kind === "tool_call") {
      const c = document.createElement("span");
      c.className = "chip";
      c.innerHTML = "🔧 <b>" + e.name + "</b>";
      wrap.appendChild(c);
    } else if (e.kind === "tool_result" && e.is_error) {
      const c = document.createElement("span");
      c.className = "chip err"; c.textContent = "⚠ " + e.name + " error";
      wrap.appendChild(c);
    }
  }
  if (wrap.children.length) { messages.appendChild(wrap); messages.scrollTop = messages.scrollHeight; }
}

async function loadServers() {
  const r = await fetch("/api/servers"); const d = await r.json();
  $("#mode").textContent = d.llm_enabled ? "LLM connected" : "LLM off (set API key)";
  $("#servers").innerHTML = d.servers.map(s =>
    `<div class="srv"><span><span class="dot">●</span> ${s.name} <small>(${s.transport})</small></span>
     <span>${s.tool_count} tools</span></div>`).join("") || "<small>none</small>";
}
async function loadLog() {
  const r = await fetch("/api/log?n=25"); const d = await r.json();
  $("#log").innerHTML = d.entries.map(e => {
    const m = e.message; const label = m.method || (m.result ? "result" : m.error ? "error" : "-");
    const cls = e.direction === "request" ? "req" : (e.direction === "response" ? "res" : "note");
    return `<div class="row ${cls}">#${e.seq} ${e.server}/${e.transport} ${e.direction} · ${label}</div>`;
  }).join("");
}

let busy = false;
async function send(text) {
  if (busy || !text.trim()) return;
  busy = true; $("#send").disabled = true; $("#suggest").style.display = "none";
  add("user", text);
  const typing = add("bot", ""); typing.className = "msg bot dots";
  typing.innerHTML = "<span>●</span><span>●</span><span>●</span>";
  try {
    const r = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"},
                                        body: JSON.stringify({message: text})});
    const d = await r.json();
    typing.remove();
    if (!r.ok) { add("sys", "⚠ " + (d.error || "error")); }
    else { addChips(d.events || []); add("bot", d.answer || "(no answer)"); }
  } catch (err) { typing.remove(); add("sys", "⚠ network error: " + err); }
  finally { busy = false; $("#send").disabled = false; loadLog(); }
}

$("#composer").addEventListener("submit", e => { e.preventDefault(); const t = $("#input").value; $("#input").value=""; send(t); });
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); }});
$("#suggest").addEventListener("click", e => { if (e.target.tagName === "BUTTON") send(e.target.textContent); });
$("#refreshlog").addEventListener("click", loadLog);

add("sys", "Welcome to FarmaValle. Ask about symptoms, products, stock or orders — or anything else.");
loadServers(); loadLog();
</script>
</body>
</html>
